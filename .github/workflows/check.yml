name: Development checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run doctor -- --ci
      - run: npm run check -- --tool ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-check-${{ matrix.os }}
          path: reports/
          if-no-files-found: warn
