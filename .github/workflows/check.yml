name: Development harness checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r product-tools/requirements.lock
      - run: python dev-harness/cli.py validate
      - run: python dev-harness/cli.py check --timeout 120 -- python -m unittest discover -s tests/dev-harness -v
      - run: python dev-harness/cli.py check --timeout 120 -- python -m unittest discover -s tests/product-tools -v
      - run: python scripts/check-product-assets.py
      - run: python dev-harness/cli.py check --timeout 120 -- python -m unittest discover -s tests/evaluation -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-harness-checks-${{ matrix.os }}
          path: .harness/checks/
          include-hidden-files: true
          if-no-files-found: warn
