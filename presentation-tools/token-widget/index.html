<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LG AX · Token Lens</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Pretendard","Segoe UI",sans-serif;background:#0a0d14;color:#edf3ff}*{box-sizing:border-box}body{margin:0;padding:28px}.shell{max-width:1120px;margin:auto}header{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:40px;height:40px;border-radius:12px;background:#b0f5d0;color:#10281b;display:grid;place-items:center;font-size:23px}h1{font-size:18px;letter-spacing:.05em;margin:0}header p{font-size:11px;color:#8e9cb5;letter-spacing:.12em;margin:5px 0 0}.badge{margin-left:auto;border:1px solid #35435b;border-radius:99px;padding:7px 12px;font-size:11px;letter-spacing:.1em;color:#bdc9dc}.badge.live{border-color:#39735a;color:#b0f5d0}.dot{display:inline-block;width:6px;height:6px;border-radius:100%;background:currentColor;margin-right:7px}.source{border:1px solid #253047;border-radius:18px;background:linear-gradient(125deg,#151c2b,#101521);padding:22px;margin-bottom:14px}.source.child{background:#0f1420;border-style:dashed}.meta{display:flex;align-items:center;gap:10px;margin-bottom:20px}.engine{font-size:15px;font-weight:650}.muted{color:#8e9cb5;font-size:11px}.state{margin-left:auto;color:#b0f5d0;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{border:1px solid #29344b;background:#151d2d;border-radius:12px;padding:16px 15px}.icon{color:#a0bbff;margin-right:6px}.name{font-size:11px;color:#aab7ce}.value{font-size:30px;letter-spacing:-.04em;font-weight:650;line-height:1.4;font-variant-numeric:tabular-nums;margin-top:7px}.unit{font-size:10px;letter-spacing:.08em;color:#7284a3}.cache-track{background:#273247;border-radius:3px;height:4px;overflow:hidden;margin-top:14px}.cache-fill{height:100%;width:0;background:#b0f5d0}.detail{display:flex;justify-content:space-between;gap:16px;margin-top:16px;font-size:11px;color:#8e9cb5;line-height:1.7}.warn{color:#ffce92}.foot{color:#8292ae;font-size:11px;line-height:1.9;margin-top:22px;border-top:1px solid #263048;padding-top:16px}.foot strong{color:#b0f5d0;font-weight:500}.time{font-variant-numeric:tabular-nums}.empty{padding:40px;border:1px dashed #35435b;border-radius:16px;color:#aab7ce}button{font:inherit;color:#bdc9dc;background:none;border:1px solid #35435b;padding:6px 10px;border-radius:8px;cursor:pointer}body.compact{padding:12px}body.compact header p,body.compact .detail,body.compact .foot{display:none}body.compact .source{padding:14px}body.compact header{margin-bottom:12px}body.compact .value{font-size:27px}@media(max-width:700px){body{padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.detail{flex-direction:column;gap:4px}.value{font-size:27px}}
</style>
<main class="shell"><header><div class="logo">◈</div><div><h1>TOKEN LENS</h1><p>LG AX · EXECUTION OBSERVATORY</p></div><span id="mode" class="badge"><i class="dot"></i>연결 준비</span><button id="compact" aria-pressed="false">작게 보기</button></header><div id="sources" class="empty">선택한 실행 기록을 기다립니다.</div><div class="foot"><strong>관찰을 위한 추가 모델 호출 0</strong> · 선택한 로그에서 관측한 사용량입니다. 원문 질문·답변·명령은 화면에 전달하지 않습니다.<br>캐시와 추론 토큰은 중복 합산하지 않습니다. 메인·하위 로그는 각각 표시합니다. 청구 금액·절감률을 추정하지 않습니다.<br><span id="updated" class="time"></span></div></main>
<script>
const $=id=>document.getElementById(id);const fmt=v=>Number.isSafeInteger(v)?v.toLocaleString('ko-KR'):'—';
const names={waiting:'기록 대기',running:'실행 중',completed:'종료 관측',failed:'실패 관측'};
const bases={unobserved:'사용량 미관측',session_cumulative:'선택 세션 누적',unique_responses:'고유 응답 사용량',unique_messages:'고유 메시지 사용량',cli_turn_reported:'CLI turn 보고값',cli_result_reported:'CLI 결과 보고값',cumulative_window_delta:'기록 구간 누적 차이'};
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function card(label,icon,value,unit){const e=node('div','card');const n=node('div','name');n.append(node('span','icon',icon),document.createTextNode(label));e.append(n,node('div','value',value),node('div','unit',unit));return e}
function duration(s){if(typeof s!=='number')return '—';return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`}
function render(d){$('mode').className='badge'+(d.mode==='live'?' live':'');$('mode').textContent=d.mode==='live'?'● LIVE · 로그 관측':'◷ REPLAY · 저장 기록';$('sources').className='';$('sources').replaceChildren();
for(const s of d.sources){const t=s.tokens,wrap=node('section','source'+(s.role==='child'?' child':'')),meta=node('div','meta');const state=s.status==='running'&&d.mode==='replay'?'진행 기록 · 종료 미관측':names[s.status]||'기록 대기';meta.append(node('span','engine',s.engine==='codex'?'Codex':'Claude'),node('span','muted',s.role==='child'?'서브에이전트 로그':'메인 로그'),node('span','state',state));wrap.append(meta);const cards=node('div','cards');cards.append(card(s.engine==='codex'?'입력 · 캐시 포함':'일반 입력 · 캐시 제외','↘',fmt(t.input),'TOKENS'),card('출력 · 추론 포함','↗',fmt(t.output),'TOKENS'),card('캐시 읽기','◈',fmt(t.cache_read),'TOKENS'),card('관측 경과','◷',duration(s.elapsed_seconds),'MIN : SEC'));wrap.append(cards);
if(s.engine==='codex'&&Number.isSafeInteger(t.input)&&t.input>0&&Number.isSafeInteger(t.cache_read)){const track=node('div','cache-track'),fill=node('div','cache-fill');fill.style.width=`${Math.min(100,t.cache_read/t.input*100)}%`;track.append(fill);wrap.append(track)}
const detail=node('div','detail');detail.append(node('span','',`${bases[s.basis]||'미관측'} · ${s.time_filter?'지정 시각 이후':'선택 세션 전체'}`),node('span','',s.engine==='claude'?`캐시 생성 ${fmt(t.cache_write)} · 일반 입력/읽기/생성 분리`:`추론 ${fmt(t.reasoning)} · 출력의 일부`));wrap.append(detail);if(s.model)wrap.append(node('div','muted',s.model));if(s.errors.length)wrap.append(node('div','detail warn','관측 범위 확인 필요 · '+s.errors.join(', ')));$('sources').append(wrap)}$('updated').textContent='최근 조회 '+new Date(d.updated_utc).toLocaleTimeString('ko-KR')+' · 전체 청구 범위는 포함하지 않습니다.'}
async function poll(){try{const r=await fetch('/usage.json',{cache:'no-store'});if(!r.ok)throw Error();render(await r.json())}catch{$('mode').textContent='연결 중단 · 마지막 관측값';$('mode').className='badge'}finally{setTimeout(poll,1000)}}
$('compact').onclick=()=>{document.body.classList.toggle('compact');const on=document.body.classList.contains('compact');$('compact').setAttribute('aria-pressed',String(on));$('compact').textContent=on?'자세히 보기':'작게 보기'};poll();
</script></html>
