<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LG AX 시각자료 뷰어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+KR:wght@400;500;700&family=Source+Code+Pro:wght@400;600&display=swap">
<style>
/* Layout: Streamlit-style app shell. Fixed navy sidebar lists the harness steps, a wide white main column holds the
   step's charts, and a dark caption bar pinned to the bottom narrates the step (as in the reference video).
   Deliberately single light theme, matching the reference look; every color is set explicitly below. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --panel: #f0f2f6;
  --text: #31333f;
  --muted: #6b7083;
  --line: #e4e8ef;
  --primary: #ff4b4b;
  --primary-ink: #ffffff;
  --accent: #3b8ed8;
  --side-1: #1f3d66;
  --side-2: #13315b;
  --side-3: #0e2646;
  --side-text: #ffffff;
  --side-muted: rgba(255, 255, 255, .74);
  --side-line: rgba(255, 255, 255, .16);
  --side-field: #ffffff;
  --side-field-text: #31333f;
  --kpi-bg: #161b2e;
  --kpi-edge: rgba(255, 255, 255, .07);
  --kpi-label: #aeb6c7;
  --cap-bg: rgba(26, 31, 43, .96);
  --cap-meta: #a3acbd;
  --cap-text: #dde2ea;
  --cap-title: #ffffff;
  --code-bg: #0f1726;
  --code-text: #e5e9f0;
  --code-inline: #0f8a3c;
  --t-blue: #3498db;
  --t-green: #2ecc71;
  --t-red: #e74c3c;
  --t-orange: #f39c12;
  --t-purple: #9b59b6;
  --t-gray: #95a0b2;
  --t-purple-lit: #b57ccf;
  --ok-bg: #e7f6ec;
  --ok-text: #156b33;
  --info-text: #0d4a85;
  --warn-bg: #fff5d9;
  --warn-text: #7d5300;
  --err-bg: #fdeaea;
  --err-text: #9b2323;
  --ink-blue: #1f6aa5;
  --ink-green: #1b7a43;
  --ink-red: #b0352a;
  --ink-orange: #96600a;
  --ink-purple: #763a93;
  --ink-gray: #5d6577;
  --tint-blue: #e8f2fb;
  --tint-green: #e6f6ec;
  --tint-red: #fdecea;
  --tint-orange: #fef3e0;
  --tint-purple: #f3eaf8;
  --tint-gray: #eef0f4;
  --chart-grid: #e9edf3;
  --chart-axis: #c5ccd8;
  --chart-text: #5a6377;
  --chart-title: #2b3044;
  --chart-halo: #ffffff;
  --tip-bg: #1f2433;
  --tip-text: #f4f6fa;
  --font: "Source Sans 3", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "Source Code Pro", "D2Coding", Consolas, "Courier New", monospace;
  --side-w: 268px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
a { color: var(--ink-blue); }
code {
  font-family: var(--mono);
  font-size: .86em;
  color: var(--code-inline);
  background: var(--panel);
  padding: .08em .38em;
  border-radius: 4px;
  overflow-wrap: anywhere;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topline {
  position: fixed; inset: 0 0 auto 0; height: 3px; z-index: 40;
  background: linear-gradient(90deg, var(--primary), #ffbd45, #fffd80);
}

/* ---------- sidebar ---------- */
.side {
  position: fixed; inset: 0 auto 0 0; width: var(--side-w); z-index: 30;
  background: linear-gradient(180deg, var(--side-1) 0%, var(--side-2) 55%, var(--side-3) 100%);
  color: var(--side-text);
  overflow-y: auto;
  padding: calc(44px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
  font-size: 14px;
}
.side hr { border: 0; border-top: 1px solid var(--side-line); margin: 6px 0; width: 100%; }
.brand-title { font-weight: 700; font-size: 1.02rem; display: flex; gap: 8px; align-items: center; }
.brand-sub { font-style: italic; color: var(--side-muted); font-size: .86rem; margin-top: 4px; }
.side-label { color: var(--side-muted); font-size: .78rem; margin-bottom: -6px; }
.side-h { font-weight: 700; font-size: .98rem; display: flex; gap: 8px; align-items: center; margin-top: 4px; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 8px;
  background: none; border: 0; padding: 4px 4px; border-radius: 6px;
  color: var(--side-text); text-align: left; cursor: pointer; font-size: .9rem; line-height: 1.35;
}
.nav-item:hover { background: rgba(255, 255, 255, .07); }
.radio {
  flex: none; width: 15px; height: 15px; border-radius: 50%;
  background: var(--side-field); border: 1px solid rgba(255, 255, 255, .5);
  display: grid; place-items: center;
}
.nav-item[aria-checked="true"] .radio { background: var(--primary); border-color: var(--primary); }
.nav-item[aria-checked="true"] .radio::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--side-field); }
.nav-item[aria-checked="true"] { font-weight: 600; }
.nav-ico { width: 1.2em; text-align: center; }

.drop {
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  background: var(--side-field); color: var(--side-field-text);
  border-radius: 8px; padding: 14px; cursor: pointer; border: 2px dashed transparent;
}
.drop.over { border-color: var(--primary); }
.drop-btn {
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; font-size: .84rem; background: var(--bg);
}
.drop-hint { font-size: .78rem; color: var(--muted); }
.filechip { display: flex; gap: 10px; align-items: flex-start; font-size: .84rem; }
.filechip b { display: block; font-weight: 500; overflow-wrap: anywhere; }
.filechip small { color: var(--side-muted); }
.side-ok {
  background: rgba(46, 204, 113, .14); border-radius: 8px; padding: 10px 12px; font-size: .86rem;
}
.side-status { display: flex; flex-wrap: wrap; gap: 6px; }
.side-pill {
  font-size: .78rem; padding: 2px 10px; border-radius: 999px; background: rgba(255, 255, 255, .12);
}
.side-pill.green { background: rgba(46, 204, 113, .25); }
.side-pill.orange { background: rgba(243, 156, 18, .28); }
.side-pill.red { background: rgba(231, 76, 60, .3); }
.btn-primary {
  background: var(--primary); color: var(--primary-ink); border: 0; border-radius: 8px;
  padding: 9px 14px; font-weight: 600; cursor: pointer; width: 100%;
}
.btn-primary:hover { filter: brightness(1.06); }
.side-foot { color: var(--side-muted); font-size: .8rem; display: flex; flex-direction: column; gap: 4px; margin-top: auto; }
.side-foot code { background: rgba(255, 255, 255, .12); color: var(--side-text); }

/* ---------- main ---------- */
.main { margin-left: var(--side-w); min-height: 100%; position: relative; }
.toolbar {
  position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; left: 16px;
  display: flex; justify-content: flex-end; align-items: center; gap: 10px; font-size: .82rem; color: var(--muted);
  pointer-events: none;
}
.toolbar > * { pointer-events: auto; }
.menu-btn { display: none; margin-right: auto; }
.tool-btn {
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: .8rem;
}
.tool-btn:hover { border-color: var(--primary); color: var(--primary); }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--t-gray); }
.live.on::before { background: var(--t-green); }
.live.off::before { background: var(--t-red); }

.content {
  max-width: 1180px; margin: 0 auto;
  padding: 64px clamp(16px, 4vw, 56px) calc(var(--cap-h, 0px) + 48px);
  display: flex; flex-direction: column; gap: 18px;
  container: main / inline-size;
}
.content > * { min-width: 0; }
.page-title {
  font-size: clamp(1.6rem, 1.2rem + 1.4vw, 2.15rem); font-weight: 700; line-height: 1.25; margin: 0;
  display: flex; gap: 14px; align-items: flex-start; text-wrap: balance; letter-spacing: -.01em;
}
.page-title .emoji { flex: none; }
.lead { margin: 0; max-width: 78ch; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 10px 0; width: 100%; }
.h2 { font-size: 1.42rem; font-weight: 600; margin: 14px 0 0; display: flex; gap: 10px; align-items: center; text-wrap: balance; }
.sec {
  border-left: 4px solid var(--accent); padding: 1px 0 1px 10px; font-weight: 600; font-size: .9rem; margin-top: 8px;
}
.text { margin: 0; max-width: 80ch; }

.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); column-gap: 28px; }
.feature { border-bottom: 1px solid var(--line); padding: 14px 0 22px; min-width: 0; }
.feature b { display: flex; gap: 8px; font-size: .92rem; }
.feature p { margin: 8px 0 0; font-size: .9rem; color: var(--text); }

.steps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; }

.metrics { display: flex; flex-wrap: wrap; gap: 18px; --kc: 5; }
.metric { flex: 0 0 calc((100% - (var(--kc) - 1) * 18px) / var(--kc)); min-width: 0; }
.metric small { display: block; font-size: .82rem; color: var(--muted); }
.metric .mv { font-size: 1.85rem; line-height: 1.25; word-break: keep-all; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.metric .mv.long { font-size: 1.3rem; line-height: 1.35; }
.metric .mn { font-size: .78rem; color: var(--muted); }

.kpis { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; --kc: 5; }
.kpi {
  flex: 0 0 calc((100% - (var(--kc) - 1) * 14px) / var(--kc));
  background: var(--kpi-bg); border: 1px solid var(--kpi-edge); border-radius: 10px;
  padding: 16px 12px 14px; text-align: center; box-shadow: 0 6px 18px rgba(15, 23, 42, .16);
  display: flex; flex-direction: column; gap: 4px; justify-content: center; min-width: 0;
}
.kpi small { color: var(--kpi-label); font-size: .8rem; }
.kpi .kv { font-size: 1.75rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi .kv .u { font-size: .9rem; font-weight: 600; margin-left: 2px; }
.kpi .kn { color: var(--kpi-label); font-size: .74rem; }
.kv.blue { color: var(--t-blue); } .kv.green { color: var(--t-green); } .kv.red { color: var(--t-red); }
.kv.orange { color: var(--t-orange); } .kv.purple { color: var(--t-purple-lit); } .kv.gray { color: var(--kpi-label); }

.row { display: grid; gap: 28px; align-items: start; }
.col { min-width: 0; display: flex; flex-direction: column; gap: 14px; }

.chart-box { margin: 0; min-width: 0; }
.chart-title { font-weight: 600; font-size: .95rem; color: var(--chart-title); margin-bottom: 2px; }
.chart { width: 100%; min-height: 60px; }
.chart svg { display: block; overflow: hidden; }
.chart-src { font-size: .76rem; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }

.callout { border-radius: 8px; padding: 12px 16px; display: flex; gap: 10px; font-size: .92rem; }
.callout.success { background: var(--ok-bg); color: var(--ok-text); }
.callout.info { background: var(--tint-blue); color: var(--info-text); }
.callout.warning { background: var(--warn-bg); color: var(--warn-text); }
.callout.error { background: var(--err-bg); color: var(--err-text); }
.callout p { margin: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; line-height: 1.5;
  padding: 1px 9px; border-radius: 999px; background: var(--tint-gray); color: var(--ink-gray); white-space: nowrap;
}
.chip { max-width: 100%; }
.chip.mono { font-family: var(--mono); font-size: .74rem; white-space: normal; overflow-wrap: anywhere; }
.chip.blue { background: var(--tint-blue); color: var(--ink-blue); }
.chip.green { background: var(--tint-green); color: var(--ink-green); }
.chip.red { background: var(--tint-red); color: var(--ink-red); }
.chip.orange { background: var(--tint-orange); color: var(--ink-orange); }
.chip.purple { background: var(--tint-purple); color: var(--ink-purple); }
.chips-title { font-size: .84rem; color: var(--muted); margin-bottom: 6px; }

.quotes { display: flex; flex-direction: column; }
.quote { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.quote:first-child { padding-top: 4px; }
.quote q { font-size: .98rem; quotes: "“" "”"; white-space: pre-line; }
.quote q.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.quote .qm { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .78rem; color: var(--muted); }
.quote .qm a { color: var(--muted); }
.quotes-title { font-weight: 600; font-size: .95rem; color: var(--chart-title); display: flex; gap: 8px; align-items: center; }

.tbl-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.tbl-tools input {
  flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; background: var(--bg);
}
.filter-btn {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: .82rem;
}
.filter-btn[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th { background: var(--panel); text-align: left; font-weight: 600; padding: 8px 12px; white-space: nowrap; position: sticky; top: 0; }
td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
td.mono { font-family: var(--mono); font-size: .78rem; white-space: nowrap; }
td.wide { min-width: 260px; max-width: 460px; white-space: pre-line; }
td.mid { min-width: 170px; max-width: 260px; }
td.link { white-space: nowrap; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl-count { font-size: .78rem; color: var(--muted); margin-top: 6px; }

.chain { display: grid; gap: 10px; align-items: stretch; }
.chain-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.chain-head { font-size: .78rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.chain-arrow { display: grid; place-items: start center; padding-top: 52px; color: var(--chart-axis); }
.node {
  border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--bg);
  display: flex; flex-direction: column; gap: 8px; min-width: 0;
}
.node-id { align-self: flex-start; }
.node p { margin: 0; font-size: .86rem; }
.node p.clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.more { background: none; border: 0; padding: 0; color: var(--ink-blue); cursor: pointer; font-size: .8rem; align-self: flex-start; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h4 { margin: 0; font-size: .98rem; display: flex; gap: 10px; align-items: baseline; }
.card h4 .n {
  flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--text); color: var(--bg);
  display: grid; place-items: center; font-size: .82rem;
}
.card p { margin: 0; font-size: .9rem; }

.list h4 { margin: 0 0 6px; font-size: .95rem; }
.list ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }

.exp { border: 1px solid var(--line); border-radius: 8px; }
.exp summary { padding: 11px 16px; cursor: pointer; font-size: .9rem; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.exp summary::-webkit-details-marker { display: none; }
.exp summary::after { content: "⌄"; color: var(--muted); transition: transform .15s; }
.exp[open] summary::after { transform: rotate(180deg); }
.exp-body { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; }

.code {
  background: var(--code-bg); color: var(--code-text); border-radius: 10px; padding: 16px 18px; margin: 0;
  font-family: var(--mono); font-size: .82rem; line-height: 1.7; overflow-x: auto; white-space: pre;
}

.files { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; }
.file-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 12px; padding: 10px 14px; align-items: center; border-top: 1px solid var(--line); }
.file-row:first-child { border-top: 0; }
.file-row small { color: var(--muted); font-size: .8rem; }
.file-row .fv { font-family: var(--mono); font-size: .78rem; overflow-wrap: anywhere; }
.copy {
  border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: .78rem; white-space: nowrap;
}
.copy:hover { border-color: var(--primary); color: var(--primary); }
.dl-btn {
  display: block; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
  color: var(--text); text-decoration: none; font-size: .9rem;
}
.dl-btn:hover { border-color: var(--primary); color: var(--primary); }

/* ---------- caption bar ---------- */
.caption {
  position: fixed; z-index: 20;
  left: calc(var(--side-w) + 24px); right: 24px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--cap-bg); color: var(--cap-text); border-radius: 8px;
  padding: 12px 44px 13px 18px; box-shadow: 0 10px 30px rgba(15, 23, 42, .25);
}
.cap-meta { font-size: .76rem; color: var(--cap-meta); }
.cap-title { font-size: 1.12rem; font-weight: 700; color: var(--cap-title); margin: 3px 0 2px; text-wrap: balance; }
.cap-text { font-size: .9rem; margin: 0; }
.cap-close {
  position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--cap-meta);
  font-size: 1.1rem; cursor: pointer; line-height: 1; padding: 4px;
}
.cap-close:hover { color: var(--cap-title); }

.tip {
  position: fixed; z-index: 60; pointer-events: none; background: var(--tip-bg); color: var(--tip-text);
  font-size: .8rem; padding: 6px 10px; border-radius: 6px; max-width: 280px; white-space: pre-line;
  box-shadow: 0 6px 16px rgba(15, 23, 42, .25);
}
.toast {
  position: fixed; z-index: 70; top: calc(52px + env(safe-area-inset-top, 0px)); right: 16px;
  background: var(--tip-bg); color: var(--tip-text); padding: 8px 14px; border-radius: 8px; font-size: .86rem;
  box-shadow: 0 6px 16px rgba(15, 23, 42, .25);
}
.scrim { position: fixed; inset: 0; background: rgba(15, 23, 42, .4); z-index: 25; }

@media (max-width: 900px) {
  .side { transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 30px rgba(0, 0, 0, .3); }
  body.nav-open .side { transform: none; }
  .main { margin-left: 0; }
  .menu-btn { display: inline-block; }
  .caption { left: 16px; right: 16px; }
  .content { padding-top: 60px; }
}
@container main (max-width: 640px) {
  .row { grid-template-columns: 1fr !important; }
}
@container main (max-width: 860px) {
  .chain { grid-template-columns: 1fr !important; }
  .chain-arrow { transform: rotate(90deg); height: 22px; padding-top: 0; place-items: center; }
}
@media (max-width: 760px) {
  .file-row { grid-template-columns: 1fr auto; }
  .file-row small { grid-column: 1 / -1; }
  .cap-title { font-size: 1rem; }
  .cap-text { font-size: .84rem; }
}
@media (max-width: 600px) {
  .cap-meta { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="topline" aria-hidden="true"></div>

<aside class="side" id="side" aria-label="단계와 세션 자료">
  <div>
    <div class="brand-title" id="brand-title"><span aria-hidden="true">📊</span> LG AX 상품기획</div>
    <div class="brand-sub" id="brand-sub">하네스 시각자료 뷰어</div>
  </div>
  <hr>
  <div class="side-label">단계 이동</div>
  <nav class="nav" id="nav" role="radiogroup" aria-label="단계"></nav>
  <hr>
  <div class="side-h"><span aria-hidden="true">📁</span> 세션 자료</div>
  <div class="side-label">화면 데이터 불러오기 (JSON)</div>
  <label class="drop" id="drop" for="file-in">
    <span class="drop-btn">파일 선택</span>
    <span class="drop-hint">또는 view JSON을 여기로 끌어 놓기</span>
  </label>
  <input type="file" id="file-in" accept=".json,application/json" hidden>
  <div class="filechip" id="filechip" hidden></div>
  <div class="side-ok" id="side-ok" hidden></div>
  <div class="side-h"><span aria-hidden="true">⚡</span> 마지막 저장</div>
  <div class="side-status" id="side-status"><span class="side-pill">데이터 없음</span></div>
  <button type="button" class="btn-primary" id="reload">🔄 다시 불러오기</button>
  <hr>
  <div class="side-foot" id="side-foot"></div>
</aside>

<main class="main" id="main">
  <div class="toolbar">
    <button type="button" class="tool-btn menu-btn" id="menu-btn" aria-controls="side" aria-expanded="false">☰ 단계</button>
    <span class="live" id="live">저장된 실행 결과</span>
    <button type="button" class="tool-btn" id="cap-toggle">자막 끄기</button>
  </div>
  <div class="content" id="content"></div>
</main>

<div class="caption" id="caption" role="status" aria-live="polite" hidden>
  <div class="cap-meta" id="cap-meta"></div>
  <div class="cap-title" id="cap-title"></div>
  <p class="cap-text" id="cap-text"></p>
  <button type="button" class="cap-close" id="cap-close" aria-label="자막 닫기">×</button>
</div>
<div class="tip" id="tip" hidden></div>

<script src="view-data.js" charset="utf-8"></script>
<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const nf = new Intl.NumberFormat('ko-KR');
  const num = (v) => (typeof v === 'number' ? nf.format(v) : esc(v));
  const TONES = ['blue', 'green', 'red', 'orange', 'purple', 'gray'];
  const tone = (t) => (TONES.indexOf(t) >= 0 ? t : 'blue');
  // External links: HTTPS only. Relative paths (same folder) are allowed; other schemes are dropped.
  const href = (h) => {
    if (!h) return null;
    const s = String(h).trim();
    if (/^https:\/\//i.test(s)) return s;
    if (/^[a-z][a-z0-9+.-]*:/i.test(s) || s.startsWith('//')) return null;
    return s;
  };
  const isLocal = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);

  let VIEW = null;
  let current = null;
  let charts = [];
  let lastSig = '';
  let lastFocus = null;
  let polling = null;
  let capHidden = false;
  try { capHidden = localStorage.getItem('lgax-cap-hidden') === '1'; } catch (e) { /* storage unavailable */ }

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.setAttribute('role', 'status');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2400);
  }

  function copyText(text) {
    const done = () => toast('복사했습니다');
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('복사하지 못했습니다. 직접 선택해 복사하세요.'); }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  /* ---------- text measuring for charts ---------- */
  const mctx = document.createElement('canvas').getContext('2d');
  function tw(text, size, weight) {
    mctx.font = (weight || 400) + ' ' + (size || 12) + 'px ' + getComputedStyle(document.body).fontFamily;
    return mctx.measureText(String(text)).width;
  }
  function fit(text, size, maxW) {
    let s = String(text);
    if (tw(s, size) <= maxW) return s;
    while (s.length > 1 && tw(s + '…', size) > maxW) s = s.slice(0, -1);
    return s + '…';
  }
  function niceTicks(max, count) {
    const target = count || 5;
    if (!(max > 0)) return { step: 1, top: 1, ticks: [0, 1] };
    if (max <= target) {
      const top = Math.max(1, Math.ceil(max));
      const ticks = []; for (let i = 0; i <= top; i++) ticks.push(i);
      return { step: 1, top, ticks };
    }
    const raw = max / target;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
    const top = Math.ceil(max / step) * step;
    const ticks = []; for (let v = 0; v <= top + step / 2; v += step) ticks.push(Math.round(v * 1000) / 1000);
    return { step, top, ticks };
  }
  const tick = (v) => (v >= 10000 ? nf.format(v / 1000) + 'k' : nf.format(v));
  // Rough width in em: CJK characters are about 1em, Latin and digits about half. Long metric values get a smaller size.
  const textEm = (s) => Array.from(String(s)).reduce((a, ch) => a + (ch.charCodeAt(0) >= 0x2e80 ? 1 : 0.58), 0);
  const fillOf = (t) => 'fill:var(--t-' + tone(t) + ')';
  const strokeOf = (t) => 'stroke:var(--t-' + tone(t) + ')';
  const tipAttr = (s) => ' data-tip="' + esc(s) + '"';

  function legend(items, W) {
    const size = 12, gap = 16, box = 10;
    const widths = items.map((it) => box + 6 + tw(it.name, size));
    const total = widths.reduce((a, b) => a + b, 0) + gap * (items.length - 1);
    let svg = '', x, y = 10, lines = 1;
    if (total <= W) {
      x = W - total;
      items.forEach((it, i) => {
        svg += '<rect x="' + x + '" y="' + (y - 8) + '" width="' + box + '" height="' + box + '" rx="2" style="' + fillOf(it.tone) + '"></rect>';
        svg += '<text x="' + (x + box + 6) + '" y="' + (y + 1) + '" font-size="' + size + '" style="fill:var(--chart-text)">' + esc(it.name) + '</text>';
        x += widths[i] + gap;
      });
    } else {
      x = 0;
      items.forEach((it, i) => {
        if (x > 0 && x + widths[i] > W) { x = 0; y += 18; lines++; }
        svg += '<rect x="' + x + '" y="' + (y - 8) + '" width="' + box + '" height="' + box + '" rx="2" style="' + fillOf(it.tone) + '"></rect>';
        svg += '<text x="' + (x + box + 6) + '" y="' + (y + 1) + '" font-size="' + size + '" style="fill:var(--chart-text)">' + esc(it.name) + '</text>';
        x += widths[i] + gap;
      });
    }
    return { svg, h: 10 + (lines - 1) * 18 + 8 };
  }
  const svgOpen = (W, H, label) => '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label || '') + '">';

  /* ---------- charts ---------- */
  const emptyChart = (W) => svgOpen(W, 48, '표시할 값 없음') + '<text x="0" y="28" font-size="13" style="fill:var(--chart-text)">표시할 값이 없습니다.</text></svg>';

  function donutChart(s, W) {
    const items = (s.items || []).filter((i) => i.value > 0);
    const total = items.reduce((a, b) => a + b.value, 0);
    if (!total) return emptyChart(W);
    const lg = legend(items.map((i) => ({ name: i.label, tone: i.tone })), W);
    const H = 300, top = lg.h + 6;
    const cy = top + (H - top) / 2;
    const cx = W / 2;
    const r = Math.max(46, Math.min((H - top) / 2 - 22, W / 2 - 104));
    const ri = r * 0.52;
    let svg = svgOpen(W, H, s.title) + lg.svg;
    let a0 = -Math.PI / 2;
    const pt = (a, rad) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
    items.forEach((it) => {
      const frac = it.value / total;
      const a1 = a0 + frac * Math.PI * 2;
      const tip = it.label + ': ' + nf.format(it.value) + (s.unit || '') + (it.note ? '\n' + it.note : '');
      if (frac >= 0.9999) {
        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((r + ri) / 2) + '" style="fill:none;' + strokeOf(it.tone) + ';stroke-width:' + (r - ri) + '"' + tipAttr(tip) + '></circle>';
      } else {
        const large = frac > 0.5 ? 1 : 0;
        const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r), [x2, y2] = pt(a1, ri), [x3, y3] = pt(a0, ri);
        svg += '<path d="M' + x0 + ' ' + y0 + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2 + ' A' + ri + ' ' + ri + ' 0 ' + large + ' 0 ' + x3 + ' ' + y3 + 'Z" style="' + fillOf(it.tone) + ';stroke:var(--chart-halo);stroke-width:2"' + tipAttr(tip) + '></path>';
      }
      const am = (a0 + a1) / 2;
      const [lx, ly] = pt(am, r + 12);
      const anchor = Math.cos(am) >= 0 ? 'start' : 'end';
      svg += '<text x="' + lx + '" y="' + (ly - 2) + '" text-anchor="' + anchor + '" font-size="12" style="fill:var(--chart-text)">' + esc(it.label) + '</text>';
      svg += '<text x="' + lx + '" y="' + (ly + 13) + '" text-anchor="' + anchor + '" font-size="12.5" font-weight="700" style="fill:var(--chart-title)">' + nf.format(it.value) + esc(s.unit || '') + '</text>';
      a0 = a1;
    });
    svg += '<text x="' + cx + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="22" font-weight="700" style="fill:var(--chart-title)">' + nf.format(total) + '</text>';
    svg += '<text x="' + cx + '" y="' + (cy + 21) + '" text-anchor="middle" font-size="11.5" style="fill:var(--chart-text)">' + esc(s.center_label || '합계') + '</text>';
    return svg + '</svg>';
  }

  function barsChart(s, W) {
    const cats = s.categories || [], series = s.series || [];
    if (!cats.length || !series.length) return emptyChart(W);
    const lg = legend(series.map((x) => ({ name: x.name, tone: x.tone })), W);
    const H = 300;
    const max = Math.max(0, ...series.flatMap((x) => x.values));
    const nt = niceTicks(max);
    const yw = Math.max(...nt.ticks.map((t) => tw(tick(t), 11))) + 10;
    const m = { l: yw, r: 6, t: lg.h + 16, b: 40 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    let svg = svgOpen(W, H, s.title) + lg.svg;
    nt.ticks.forEach((t) => {
      const y = m.t + ph - (t / nt.top) * ph;
      svg += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y + '" y2="' + y + '" style="stroke:var(--chart-grid)"></line>';
      svg += '<text x="' + (m.l - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" style="fill:var(--chart-text)">' + tick(t) + '</text>';
    });
    const band = pw / Math.max(1, cats.length);
    const gw = band * 0.74, bw = gw / Math.max(1, series.length);
    cats.forEach((c, i) => {
      series.forEach((sr, j) => {
        const v = sr.values[i] || 0;
        const h = (v / nt.top) * ph;
        const x = m.l + i * band + (band - gw) / 2 + j * bw;
        const y = m.t + ph - h;
        svg += '<rect x="' + (x + 1.5) + '" y="' + y + '" width="' + Math.max(1, bw - 3) + '" height="' + Math.max(0, h) + '" rx="2" style="' + fillOf(sr.tone) + '"' + tipAttr(c + ' · ' + sr.name + ': ' + nf.format(v) + (s.unit || '')) + '></rect>';
        if (v > 0 && bw >= 14) svg += '<text x="' + (x + bw / 2) + '" y="' + (y - 5) + '" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--chart-title)">' + nf.format(v) + '</text>';
      });
      svg += '<text x="' + (m.l + i * band + band / 2) + '" y="' + (H - m.b + 18) + '" text-anchor="middle" font-size="12" style="fill:var(--chart-text)">' + esc(fit(c, 12, band - 6)) + '</text>';
    });
    svg += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + (m.t + ph) + '" y2="' + (m.t + ph) + '" style="stroke:var(--chart-axis)"></line>';
    return svg + '</svg>';
  }

  function hbarsChart(s, W) {
    const items = s.items || [];
    if (!items.length) return emptyChart(W);
    const rowH = 32, top = 6, axisH = 26;
    const H = top + items.length * rowH + axisH;
    const max = Math.max(0, ...items.map((i) => i.value));
    const nt = niceTicks(max, 4);
    const labelW = Math.min(W * 0.46, Math.max(...items.map((i) => tw(i.label, 12.5))) + 14);
    const valW = Math.max(...items.map((i) => tw(nf.format(i.value) + (s.unit || ''), 12, 600))) + 12;
    const x0 = labelW, pw = Math.max(40, W - labelW - valW);
    let svg = svgOpen(W, H, s.title);
    nt.ticks.forEach((t) => {
      const x = x0 + (t / nt.top) * pw;
      svg += '<line x1="' + x + '" x2="' + x + '" y1="' + top + '" y2="' + (H - axisH + 4) + '" style="stroke:var(--chart-grid)"></line>';
      svg += '<text x="' + x + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" style="fill:var(--chart-text)">' + tick(t) + '</text>';
    });
    items.forEach((it, i) => {
      const y = top + i * rowH;
      const bh = rowH * 0.6;
      const w = Math.max(it.value > 0 ? 2 : 0, (it.value / nt.top) * pw);
      const t = it.tone || s.tone || 'blue';
      svg += '<text x="' + (labelW - 10) + '" y="' + (y + rowH / 2 + 4) + '" text-anchor="end" font-size="12.5" style="fill:var(--chart-text)">' + esc(fit(it.label, 12.5, labelW - 14)) + '</text>';
      svg += '<rect x="' + x0 + '" y="' + (y + (rowH - bh) / 2) + '" width="' + w + '" height="' + bh + '" rx="2" style="' + fillOf(t) + '"' + tipAttr(it.label + ': ' + nf.format(it.value) + (s.unit || '') + (it.note ? '\n' + it.note : '')) + '></rect>';
      svg += '<text x="' + (x0 + w + 6) + '" y="' + (y + rowH / 2 + 4) + '" font-size="12" font-weight="600" style="fill:var(--chart-title)">' + nf.format(it.value) + esc(s.unit || '') + '</text>';
    });
    return svg + '</svg>';
  }

  function lineChart(s, W) {
    const xs = s.x || [], series = s.series || [];
    if (!xs.length || !series.length) return emptyChart(W);
    const lg = legend(series.map((x) => ({ name: x.name, tone: x.tone })), W);
    const H = s.height || 290;
    const max = Math.max(0, ...series.flatMap((x) => x.values));
    const nt = niceTicks(max);
    const yw = Math.max(...nt.ticks.map((t) => tw(tick(t), 11))) + 10;
    const twoLine = xs.some((x) => String(x).indexOf('\n') >= 0);
    const m = { l: yw, r: 10, t: lg.h + 22, b: twoLine ? 44 : 30 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const pad = Math.min(34, pw * 0.07);
    const px = (i) => m.l + pad + (xs.length > 1 ? (i * (pw - 2 * pad)) / (xs.length - 1) : (pw - 2 * pad) / 2);
    const py = (v) => m.t + ph - (v / nt.top) * ph;
    let svg = svgOpen(W, H, s.title) + lg.svg;
    nt.ticks.forEach((t) => {
      svg += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + py(t) + '" y2="' + py(t) + '" style="stroke:var(--chart-grid)"></line>';
      svg += '<text x="' + (m.l - 8) + '" y="' + (py(t) + 4) + '" text-anchor="end" font-size="11" style="fill:var(--chart-text)">' + tick(t) + '</text>';
    });
    series.forEach((sr) => {
      const pts = sr.values.map((v, i) => [px(i), py(v)]);
      if (sr.area) {
        const d = 'M' + pts[0][0] + ' ' + py(0) + ' ' + pts.map((p) => 'L' + p[0] + ' ' + p[1]).join(' ') + ' L' + pts[pts.length - 1][0] + ' ' + py(0) + 'Z';
        svg += '<path d="' + d + '" style="' + fillOf(sr.tone) + ';fill-opacity:.14"></path>';
      }
      svg += '<path d="' + pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ') + '" style="fill:none;' + strokeOf(sr.tone) + ';stroke-width:2.2;stroke-linejoin:round"></path>';
      pts.forEach((p, i) => {
        const pt = (sr.point_tones && sr.point_tones[i]) || sr.tone;
        const note = sr.point_notes && sr.point_notes[i] ? '\n' + sr.point_notes[i] : '';
        svg += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="5" style="' + fillOf(pt) + ';stroke:var(--chart-halo);stroke-width:2"' + tipAttr(String(xs[i]).replace('\n', ' ') + ' · ' + sr.name + ': ' + nf.format(sr.values[i]) + (s.unit || '') + note) + '></circle>';
        if (s.labels !== false && xs.length <= 10) svg += '<text x="' + p[0] + '" y="' + (p[1] - 10) + '" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--chart-title)">' + nf.format(sr.values[i]) + '</text>';
      });
    });
    xs.forEach((x, i) => {
      String(x).split('\n').forEach((ln, k) => {
        svg += '<text x="' + px(i) + '" y="' + (H - m.b + 18 + k * 14) + '" text-anchor="middle" font-size="' + (k ? 11 : 12) + '" style="fill:var(--chart-text)">' + esc(ln) + '</text>';
      });
    });
    svg += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + py(0) + '" y2="' + py(0) + '" style="stroke:var(--chart-axis)"></line>';
    return svg + '</svg>';
  }

  const CHARTS = { donut: donutChart, bars: barsChart, hbars: hbarsChart, line: lineChart };

  // Card rows: as many columns as fit, then even out the rows so no card is left alone.
  function balance(el, gap, min) {
    const n = el.children.length;
    if (!n) return;
    const W = el.clientWidth;
    let c = n;
    while (c > 1 && (W - gap * (c - 1)) / c < min) c--;
    c = Math.ceil(n / Math.ceil(n / c));
    el.style.setProperty('--kc', c);
  }

  function drawCharts() {
    document.querySelectorAll('.kpis, .metrics').forEach((el) => {
      el.dataset.w = Math.max(200, Math.floor(el.clientWidth));
      if (el.classList.contains('kpis')) balance(el, 14, 140); else balance(el, 18, 150);
    });
    charts.forEach((c) => {
      const el = document.getElementById(c.id);
      if (!el) return;
      const W = Math.max(200, Math.floor(el.clientWidth));
      el.dataset.w = W;
      el.innerHTML = CHARTS[c.spec.type](c.spec, W);
    });
  }

  // Redraw when a chart's column changes width (scrollbar appearing, sidebar toggling, container breakpoints).
  let raf = 0;
  const ro = typeof ResizeObserver === 'function' ? new ResizeObserver((entries) => {
    const changed = entries.some((en) => String(Math.max(200, Math.floor(en.target.clientWidth))) !== en.target.dataset.w);
    if (changed) { cancelAnimationFrame(raf); raf = requestAnimationFrame(drawCharts); }
  }) : null;
  function observeCharts() {
    if (!ro) return;
    ro.disconnect();
    charts.forEach((c) => { const el = document.getElementById(c.id); if (el) ro.observe(el); });
    document.querySelectorAll('.kpis, .metrics').forEach((el) => ro.observe(el));
  }

  /* ---------- blocks ---------- */
  function chipHTML(c) {
    if (typeof c === 'string') return '<span class="chip">' + esc(c) + '</span>';
    return '<span class="chip ' + (c.tone ? tone(c.tone) : '') + (c.mono ? ' mono' : '') + '"' + (c.tip ? ' title="' + esc(c.tip) + '"' : '') + '>' + esc(c.text) + '</span>';
  }
  function chipsHTML(list) {
    return '<div class="chips">' + (list || []).map(chipHTML).join('') + '</div>';
  }
  function srcHTML(src) {
    return src ? '<div class="chart-src">출처: ' + esc(src) + '</div>' : '';
  }
  function cellHTML(col, v) {
    if (v == null || v === '') return '<td class="' + (col.kind || '') + '">–</td>';
    if (col.kind === 'chips') return '<td>' + chipsHTML(Array.isArray(v) ? v : [v]) + '</td>';
    if (col.kind === 'pill') return '<td>' + chipHTML(typeof v === 'string' ? { text: v } : v) + '</td>';
    if (col.kind === 'link') {
      const h = href(typeof v === 'string' ? v : v.href);
      const label = typeof v === 'string' ? '열기' : v.text || '열기';
      return '<td class="link">' + (h ? '<a href="' + esc(h) + '" target="_blank" rel="noopener">' + esc(label) + '</a>' : '–') + '</td>';
    }
    return '<td class="' + (col.kind || '') + '">' + (typeof v === 'number' ? num(v) : md(v)) + '</td>';
  }

  let tableSeq = 0;
  function tableHTML(b) {
    const id = 'tbl-' + (++tableSeq);
    const cols = b.columns || [];
    let tools = '';
    if (b.search || b.filter) {
      tools += '<div class="tbl-tools">';
      if (b.search) tools += '<input type="search" id="' + id + '-q" placeholder="' + esc(b.search_placeholder || '검색') + '" aria-label="표 검색" data-table="' + id + '">';
      if (b.filter) {
        const vals = [];
        (b.rows || []).forEach((r) => { const v = r[b.filter]; const t = typeof v === 'object' && v ? v.text : v; if (t && vals.indexOf(t) < 0) vals.push(t); });
        tools += '<button type="button" class="filter-btn" aria-pressed="true" data-table="' + id + '" data-val="">전체</button>';
        vals.forEach((v) => { tools += '<button type="button" class="filter-btn" aria-pressed="false" data-table="' + id + '" data-val="' + esc(v) + '">' + esc(v) + '</button>'; });
      }
      tools += '</div>';
    }
    let html = (b.title ? '<div class="chart-title">' + esc(b.title) + '</div>' : '') + tools;
    html += '<div class="tbl-wrap"><table id="' + id + '" data-filter-key="' + esc(b.filter || '') + '"><thead><tr>' + cols.map((c) => '<th scope="col">' + esc(c.label) + '</th>').join('') + '</tr></thead><tbody>';
    (b.rows || []).forEach((r) => {
      const fv = b.filter ? (typeof r[b.filter] === 'object' && r[b.filter] ? r[b.filter].text : r[b.filter]) : '';
      html += '<tr data-f="' + esc(fv || '') + '">' + cols.map((c) => cellHTML(c, r[c.key])).join('') + '</tr>';
    });
    html += '</tbody></table></div>' + (b.count === false ? '' : '<div class="tbl-count" id="' + id + '-n">' + nf.format((b.rows || []).length) + '건</div>');
    return html + srcHTML(b.source);
  }
  function applyTable(id) {
    const tbl = document.getElementById(id);
    if (!tbl) return;
    const q = ($('#' + id + '-q') || { value: '' }).value.trim().toLowerCase();
    const on = document.querySelector('.filter-btn[data-table="' + id + '"][aria-pressed="true"]');
    const fv = on ? on.getAttribute('data-val') : '';
    let n = 0;
    tbl.querySelectorAll('tbody tr').forEach((tr) => {
      const show = (!q || tr.textContent.toLowerCase().indexOf(q) >= 0) && (!fv || tr.getAttribute('data-f') === fv);
      tr.hidden = !show;
      if (show) n++;
    });
    const cnt = document.getElementById(id + '-n');
    if (cnt) cnt.textContent = nf.format(n) + '건';
  }

  function nodeHTML(n) {
    const long = String(n.text || '').length > 100;
    return '<div class="node">' +
      (n.id ? '<span class="node-id">' + chipHTML({ text: n.id + (n.title ? ' · ' + n.title : ''), tone: n.tone }) + '</span>' : '') +
      (n.text ? '<p class="' + (long ? 'clamp' : '') + '">' + md(n.text) + '</p>' + (long ? '<button type="button" class="more">더 보기</button>' : '') : '') +
      (n.tags && n.tags.length ? chipsHTML(n.tags) : '') +
      (n.sources && n.sources.length ? '<div class="chips">' + n.sources.map((s) => chipHTML({ text: s, mono: true })).join('') + '</div>' : '') +
      '</div>';
  }

  let chartSeq = 0;
  function blockHTML(b) {
    switch (b.type) {
      case 'lead': return '<p class="lead">' + md(b.text) + '</p>';
      case 'text': return '<p class="text">' + md(b.text) + '</p>';
      case 'divider': return '<hr class="divider">';
      case 'heading': return '<h2 class="h2">' + (b.icon ? '<span aria-hidden="true">' + esc(b.icon) + '</span>' : '') + esc(b.text) + '</h2>';
      case 'section': return '<div class="sec">' + esc(b.text) + '</div>';
      case 'features':
        return '<div class="features">' + (b.items || []).map((f) => '<div class="feature"><b>' + (f.icon ? '<span aria-hidden="true">' + esc(f.icon) + '</span>' : '') + esc(f.title) + '</b><p>' + md(f.text) + '</p></div>').join('') + '</div>';
      case 'steps': return '<ol class="steps">' + (b.items || []).map((s) => '<li>' + md(s) + '</li>').join('') + '</ol>';
      case 'metrics':
        return '<div class="metrics">' + (b.items || []).map((m) => '<div class="metric"><small>' + esc(m.label) + '</small><div class="mv' + (textEm(String(m.value) + (m.unit || '')) > 5.2 ? ' long' : '') + '">' + num(m.value) + (m.unit ? ' ' + esc(m.unit) : '') + '</div>' + (m.note ? '<div class="mn">' + esc(m.note) + '</div>' : '') + '</div>').join('') + '</div>';
      case 'kpis':
        return '<div class="kpis">' + (b.items || []).map((k) => '<div class="kpi"' + (k.source ? ' title="출처: ' + esc(k.source) + '"' : '') + '><small>' + esc(k.label) + '</small><div class="kv ' + tone(k.tone) + '">' + (k.emoji ? '<span aria-hidden="true">' + esc(k.emoji) + '</span> ' : '') + num(k.value) + (k.unit ? '<span class="u">' + esc(k.unit) + '</span>' : '') + '</div>' + (k.note ? '<div class="kn">' + esc(k.note) + '</div>' : '') + '</div>').join('') + '</div>' + srcHTML(b.source);
      case 'donut': case 'bars': case 'hbars': case 'line': {
        const id = 'ch-' + (++chartSeq);
        charts.push({ id, spec: b });
        return '<figure class="chart-box">' + (b.title ? '<figcaption class="chart-title">' + esc(b.title) + '</figcaption>' : '') + '<div class="chart" id="' + id + '"></div>' + srcHTML(b.source) + '</figure>';
      }
      case 'row': {
        const cols = b.cols || [];
        const tpl = cols.map((c) => (c.span || 1) + 'fr').join(' ');
        return '<div class="row" style="grid-template-columns:' + esc(tpl) + '">' + cols.map((c) => '<div class="col">' + (c.blocks || []).map(blockHTML).join('') + '</div>').join('') + '</div>';
      }
      case 'callout': {
        const icons = { success: '✅', info: 'ℹ️', warning: '⚠️', error: '⛔' };
        const t = icons[b.tone] ? b.tone : 'info';
        return '<div class="callout ' + t + '"><span aria-hidden="true">' + icons[t] + '</span><p>' + md(b.text) + '</p></div>';
      }
      case 'chips': return (b.title ? '<div class="chips-title">' + esc(b.title) + '</div>' : '') + chipsHTML(b.items) + srcHTML(b.source);
      case 'quotes':
        return '<div class="quotes">' + (b.title ? '<div class="quotes-title">' + (b.chip ? chipHTML(b.chip) : '') + esc(b.title) + '</div>' : '') +
          (b.items || []).map((q) => {
            const h = href(q.href);
            const long = String(q.quote || '').length > 140;
            return '<div class="quote"><q' + (long ? ' class="clamp"' : '') + '>' + esc(q.quote) + '</q>' + (long ? '<button type="button" class="more">더 보기</button>' : '') + '<div class="qm">' + (q.chips || []).map(chipHTML).join('') +
              (q.meta ? '<span>' + esc(q.meta) + '</span>' : '') + (h ? '<a href="' + esc(h) + '" target="_blank" rel="noopener">원문 페이지</a>' : '') + '</div></div>';
          }).join('') + '</div>';
      case 'table': return '<div>' + tableHTML(b) + '</div>';
      case 'chain': {
        const cols = b.columns || [];
        const tpl = cols.map(() => 'minmax(0,1fr)').join(' 28px ');
        let html = '<div class="chain" style="grid-template-columns:' + tpl + '">';
        cols.forEach((c, i) => {
          if (i) html += '<div class="chain-arrow" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M3 11h14M12 5l6 6-6 6" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"></path></svg></div>';
          html += '<div class="chain-col"><div class="chain-head">' + esc(c.title) + '</div>' + (c.nodes || []).map(nodeHTML).join('') + '</div>';
        });
        return html + '</div>' + srcHTML(b.source);
      }
      case 'cards':
        return '<div class="cards">' + (b.items || []).map((c, i) => '<div class="card"><h4>' + (b.numbered ? '<span class="n">' + (i + 1) + '</span>' : '') + esc(c.title) + '</h4><p>' + md(c.text) + '</p>' + (c.chips ? chipsHTML(c.chips) : '') + '</div>').join('') + '</div>';
      case 'list':
        return '<div class="list">' + (b.title ? '<h4>' + esc(b.title) + '</h4>' : '') + '<ul>' + (b.items || []).map((x) => '<li>' + md(x) + '</li>').join('') + '</ul></div>';
      case 'expander':
        return '<details class="exp"' + (b.open ? ' open' : '') + '><summary>' + esc((b.icon ? b.icon + ' ' : '') + b.title) + '</summary><div class="exp-body">' + (b.blocks || []).map(blockHTML).join('') + '</div></details>';
      case 'code': return '<pre class="code">' + esc(b.text) + '</pre>';
      case 'files':
        return '<div class="files">' + (b.items || []).map((f) => '<div class="file-row"><small>' + esc(f.label) + '</small><span class="fv">' + esc(f.value) + '</span>' +
          (f.copy !== false ? '<button type="button" class="copy" data-copy="' + esc(f.value) + '">복사</button>' : '<span></span>') + '</div>').join('') + '</div>' +
          (b.href && href(b.href) ? '<a class="dl-btn" href="' + esc(href(b.href)) + '" target="_blank" rel="noopener">⬇️ ' + esc(b.href_label || '파일 열기') + '</a>' : '');
      default: return '';
    }
  }

  /* ---------- page + chrome ---------- */
  function pageById(id) { return (VIEW && VIEW.pages || []).find((p) => p.id === id); }

  function renderSidebar() {
    const app = VIEW.app || {};
    $('#brand-title').innerHTML = '<span aria-hidden="true">' + esc(app.icon || '📊') + '</span> ' + esc(app.title || 'LG AX 상품기획');
    $('#brand-sub').textContent = app.subtitle || '하네스 시각자료 뷰어';
    $('#nav').innerHTML = (VIEW.pages || []).map((p) => '<button type="button" class="nav-item" role="radio" aria-checked="' + (p.id === current) + '" data-page="' + esc(p.id) + '"><span class="radio" aria-hidden="true"></span><span class="nav-ico" aria-hidden="true">' + esc(p.icon || '📄') + '</span><span>' + esc(p.nav || p.title) + '</span></button>').join('');
    const ctx = VIEW.context || {};
    const fc = $('#filechip');
    if (ctx.file) {
      fc.hidden = false;
      fc.innerHTML = '<span aria-hidden="true">📄</span><div><b>' + esc(ctx.file.name) + '</b><small>' + esc(ctx.file.size || '') + '</small></div>';
    } else { fc.hidden = true; }
    const ok = $('#side-ok');
    ok.hidden = !ctx.loaded;
    ok.textContent = ctx.loaded ? '✅ ' + ctx.loaded : '';
    $('#side-status').innerHTML = (ctx.status || [{ text: '데이터 없음' }]).map((s) => '<span class="side-pill ' + (s.tone ? tone(s.tone) : '') + '"' + (s.tip ? ' title="' + esc(s.tip) + '"' : '') + '>' + esc(s.text) + '</span>').join('');
    $('#side-foot').innerHTML = (ctx.footer || []).map((f) => '<span>' + md(f) + '</span>').join('');
  }

  function renderCaption(p) {
    const cap = $('#caption');
    const c = p && p.caption;
    if (!c || capHidden) {
      cap.hidden = true;
      document.documentElement.style.setProperty('--cap-h', '0px');
      $('#cap-toggle').textContent = '자막 보기';
      $('#cap-toggle').hidden = !c;
      return;
    }
    cap.hidden = false;
    $('#cap-toggle').hidden = false;
    $('#cap-toggle').textContent = '자막 끄기';
    $('#cap-meta').textContent = c.meta || (VIEW.context && VIEW.context.meta) || '';
    $('#cap-title').textContent = c.title || '';
    $('#cap-text').textContent = c.text || '';
    document.documentElement.style.setProperty('--cap-h', cap.offsetHeight + 'px');
  }

  function renderPage(id) {
    const p = pageById(id) || (VIEW.pages || [])[0];
    if (!p) return renderEmpty();
    current = p.id;
    charts = [];
    chartSeq = 0;
    tableSeq = 0;
    let html = '<h1 class="page-title">' + (p.title_icon ? '<span class="emoji" aria-hidden="true">' + esc(p.title_icon) + '</span>' : '') + '<span>' + esc(p.title) + '</span></h1>';
    html += (p.blocks || []).map(blockHTML).join('');
    $('#content').innerHTML = html;
    document.querySelectorAll('.nav-item').forEach((b) => b.setAttribute('aria-checked', String(b.getAttribute('data-page') === current)));
    renderCaption(p);
    drawCharts();
    observeCharts();
    document.title = p.title + ' · ' + ((VIEW.app && VIEW.app.title) || 'LG AX 시각자료 뷰어');
  }

  function renderEmpty(msg) {
    current = null;
    charts = [];
    $('#nav').innerHTML = '';
    $('#content').innerHTML =
      '<h1 class="page-title"><span class="emoji" aria-hidden="true">⏳</span><span>시각자료를 기다리는 중</span></h1>' +
      '<p class="lead">' + md(msg || 'CLI가 이 폴더에 **view-data.js**를 만들면 화면이 자동으로 그려집니다. 이미 만든 view JSON이 있으면 왼쪽에서 불러오세요.') + '</p>' +
      '<pre class="code">python build_view.py --export &lt;export 파일&gt; --insights &lt;insights 파일&gt; --open</pre>';
    $('#caption').hidden = true;
  }

  function signature(v) {
    try { return (v.generated_at || '') + ':' + JSON.stringify(v).length; } catch (e) { return String(Math.random()); }
  }

  function load(view, source) {
    if (!view || view.kind !== 'lgax-view' || !Array.isArray(view.pages)) {
      if (view && view.turns && view.requests) {
        toast('export 원본입니다. build_view.py로 화면 데이터로 바꾼 뒤 여세요.');
      } else if (source === 'file') {
        toast('lgax-view 형식의 JSON이 아닙니다.');
      }
      if (!VIEW) renderEmpty();
      return false;
    }
    const focusChanged = view.focus && view.focus !== lastFocus;
    VIEW = view;
    lastSig = signature(view);
    lastFocus = view.focus || null;
    const fromHash = decodeURIComponent(location.hash.replace(/^#/, ''));
    let target = current;
    if (focusChanged && source !== 'boot') target = view.focus;
    if (!target) target = pageById(fromHash) ? fromHash : (view.focus || view.pages[0].id);
    if (!pageById(target)) target = view.pages[0].id;
    current = target;
    renderSidebar();
    renderPage(target);
    try {
      if (location.hash.replace(/^#/, '') !== target) history.replaceState(null, '', '#' + encodeURIComponent(target));
    } catch (e) { /* some previews block history changes */ }
    return true;
  }

  /* ---------- live reload (local files only) ---------- */
  function poll(manual) {
    const s = document.createElement('script');
    s.src = 'view-data.js?ts=' + Date.now();
    s.charset = 'utf-8';
    s.onload = () => {
      s.remove();
      setLive('on');
      const v = window.LGAX_VIEW;
      if (v && signature(v) !== lastSig) {
        load(v, 'poll');
        if (!manual) toast('새 시각자료를 반영했습니다');
      } else if (manual) {
        toast('바뀐 내용이 없습니다');
      }
    };
    s.onerror = () => { s.remove(); setLive('off'); if (manual) toast('view-data.js를 읽지 못했습니다'); };
    document.head.appendChild(s);
  }
  function setLive(state) {
    const el = $('#live');
    el.className = 'live ' + (state || '');
    el.textContent = state === 'on' ? '저장된 실행 결과 · 자동 갱신' : state === 'off' ? '데이터 파일 없음' : '저장된 실행 결과';
  }
  function startPolling() {
    if (polling || window.LGAX_VIEW_INLINE || !isLocal) return;
    polling = setInterval(() => poll(false), 2000);
    setLive('on');
  }
  function stopPolling() {
    if (polling) clearInterval(polling);
    polling = null;
    setLive('');
  }

  /* ---------- events ---------- */
  document.addEventListener('click', (e) => {
    const nav = e.target.closest('.nav-item');
    if (nav) {
      const id = nav.getAttribute('data-page');
      try { history.pushState(null, '', '#' + encodeURIComponent(id)); } catch (err) { /* some previews block history changes */ }
      renderPage(id);
      document.body.classList.remove('nav-open');
      $('#menu-btn').setAttribute('aria-expanded', 'false');
      const sc = $('.scrim'); if (sc) sc.remove();
      window.scrollTo(0, 0);
      return;
    }
    const cp = e.target.closest('.copy');
    if (cp) { copyText(cp.getAttribute('data-copy')); return; }
    const fb = e.target.closest('.filter-btn');
    if (fb) {
      const id = fb.getAttribute('data-table');
      document.querySelectorAll('.filter-btn[data-table="' + id + '"]').forEach((b) => b.setAttribute('aria-pressed', String(b === fb)));
      applyTable(id);
      return;
    }
    const more = e.target.closest('.more');
    if (more) {
      const p = more.previousElementSibling;
      const open = p.classList.toggle('clamp');
      more.textContent = open ? '더 보기' : '접기';
      return;
    }
    if (e.target.closest('.scrim')) {
      document.body.classList.remove('nav-open');
      $('#menu-btn').setAttribute('aria-expanded', 'false');
      e.target.closest('.scrim').remove();
    }
  });
  document.addEventListener('input', (e) => {
    if (e.target.matches('input[data-table]')) applyTable(e.target.getAttribute('data-table'));
  });
  window.addEventListener('hashchange', () => {
    const id = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (VIEW && pageById(id) && id !== current) renderPage(id);
  });
  window.addEventListener('popstate', () => {
    const id = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (VIEW && pageById(id) && id !== current) renderPage(id);
  });
  let rt = null;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { drawCharts(); const p = pageById(current); if (p) renderCaption(p); }, 120);
  });

  $('#menu-btn').addEventListener('click', () => {
    const open = !document.body.classList.contains('nav-open');
    document.body.classList.toggle('nav-open', open);
    $('#menu-btn').setAttribute('aria-expanded', String(open));
    if (open) { const sc = document.createElement('div'); sc.className = 'scrim'; document.body.appendChild(sc); }
    else { const sc = $('.scrim'); if (sc) sc.remove(); }
  });
  $('#cap-close').addEventListener('click', () => {
    capHidden = true;
    try { localStorage.setItem('lgax-cap-hidden', '1'); } catch (e) { /* storage unavailable */ }
    renderCaption(pageById(current));
  });
  $('#cap-toggle').addEventListener('click', () => {
    capHidden = !capHidden;
    try { localStorage.setItem('lgax-cap-hidden', capHidden ? '1' : '0'); } catch (e) { /* storage unavailable */ }
    renderCaption(pageById(current));
  });
  $('#reload').addEventListener('click', () => {
    if (window.LGAX_VIEW_INLINE) { toast('이 파일은 데이터가 들어 있는 단일 보고서입니다'); return; }
    poll(true);
    if (isLocal && !polling) startPolling();
  });

  function readFile(f) {
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const v = JSON.parse(r.result);
        if (load(v, 'file')) { stopPolling(); toast(f.name + ' 파일을 열었습니다 (자동 갱신 멈춤)'); }
      } catch (err) { toast('JSON을 읽지 못했습니다: ' + err.message); }
    };
    r.readAsText(f, 'utf-8');
  }
  $('#file-in').addEventListener('change', (e) => readFile(e.target.files[0]));
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => readFile(e.dataTransfer.files[0]));

  const tip = $('#tip');
  document.addEventListener('mousemove', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.hidden = true; return; }
    tip.textContent = t.getAttribute('data-tip');
    tip.hidden = false;
    const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    const y = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  });

  /* ---------- boot ---------- */
  if (window.LGAX_VIEW) load(window.LGAX_VIEW, 'boot');
  else renderEmpty();
  if (!window.LGAX_VIEW_INLINE && isLocal) startPolling();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawCharts(); const p = pageById(current); if (p) renderCaption(p); });
})();
</script>
</body>
</html>
