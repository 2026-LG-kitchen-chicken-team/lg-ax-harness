function renderKeywords(r){\r

 if(!words.length)return section('키워드별 언급 건수','<p class="empty-result">집계할 원자료 본문이나 단어가 없습니다.</p>','keyword-frequency');\r
 const countTable=rows=>'<div class="keyword-table-wrap"><table class="keyword-table"><thead><tr><th scope="col">단어</th><th scope="col">언급 자료</th><th scope="col">등장 횟수</th></tr></thead><tbody>'+rows.map(w=>'<tr><th scope="row">'+e(w.term)+'</th><td><strong>'+e(w.documentCount)+'</strong><span>건</span></td><td><strong>'+e(w.occurrences)+'</strong><span>회</span></td></tr>').join('')+'</tbody></table></div>';\r
 const shown=words.slice(0,50),first=shown.slice(0,12),rest=shown.slice(12);\r
 const countGrid=rows=>rows.length>6?'<div class="keyword-tables">'+countTable(rows.slice(0,Math.ceil(rows.length/2)))+countTable(rows.slice(Math.ceil(rows.length/2)))+'</div>':countTable(rows);\r
 return section('키워드별 언급 건수','<p class="keyword-intro">원자료 <strong>'+e(summary.documentCount||0)+'건</strong>에서 집계했습니다. <b>언급 자료</b>는 단어가 나온 자료 수, <b>등장 횟수</b>는 같은 자료 안의 반복을 포함한 횟수입니다.</p>'+countGrid(first)+(rest.length?'<details class="keyword-more"><summary>단어 '+rest.length+'개 더 보기</summary>'+countGrid(rest)+'</details>':'')+(words.length>50?'<p class="metric-note">전체 '+words.length+'개 단어 중 상위 50개를 표시합니다.</p>':'')+'<details class="keyword-method"><summary>집계 기준 확인</summary><p>'+e(summary.method||'원자료 본문에서 같은 표기의 단어를 집계합니다.')+'</p>'+(summary.syntheticDocumentCount?'<p>이 중 '+e(summary.syntheticDocumentCount)+'건은 합성 예시 자료입니다.</p>':'')+'</details>','keyword-frequency');\r
}\r
function renderBusiness(r){\r
 let html='';\r
 if(r.request||r.products?.length){html+=section('기획 요청과 분석 범위',(r.request?'<blockquote class="request-quote">'+e(r.request)+'</blockquote>':'')+(r.products?.length?table(['제품 모델','제품군','자료 버전'],r.products.map(p=>[p.model||p.name||'미제공',label(p.category)||'미제공',p.documentVersion||p.modelVersion||'미제공'])):'')+figure('이번 결과에 포함된 분석 항목','<div class="metric-grid">'+[[r.evidence.length,'연결 근거','원문·자료 항목'],[r.discomforts.length,'고객 불편','결과에 정리된 항목'],[r.existingFeatures.length,'기존 기능','비교한 기능 항목'],[r.concepts.length,'개선안 후보','하네스가 제시한 후보']].map(x=>'<article class="stat"><strong>'+x[0]+'</strong><h3>'+x[1]+'</h3><p>'+x[2]+'</p></article>').join('')+'</div>','현재 결과 파일의 항목 수입니다. 고객 수·시장 비율·성능 점수를 뜻하지 않습니다.'));}\r
 html+=renderKeywords(r);\r
 if(r.discomforts.length||r.existingFeatures.length||r.remainingDiscomforts.length){\r
  html+=section('고객 불편과 기존 기능 대조',(r.discomforts.length?figure('결과에서 확인한 고객 불편',cards(r.discomforts,'discomforts')):'')+(r.existingFeatures.length?figure('대조한 기존 기능',cards(r.existingFeatures,'existingFeatures')):'')+(r.remainingDiscomforts.length?figure('기존 기능으로도 남는 문제',cards(r.remainingDiscomforts,'remainingDiscomforts')):'') );\r
 }\r
 if(r.concepts.length)html+=section('개선안과 요구사항',figure('검토할 상품기획 후보',cards(r.concepts,'concepts'),'후보의 효과와 실현 가능성은 연결된 근거·가정과 함께 검토합니다.'));\r
 if(r.assumptions.length)html+=section('확인할 가정',prose(r.assumptions));\r
 if(r.review.checks?.length||r.review.summary){html+=section('검토 결과',(r.review.summary&&!r.review.checks?.length?prose([r.review.summary]):'')+(r.review.checks?.length?table(['검토 항목','판정·내용'],r.review.checks.map((c,i)=>[c.title||c.id||'항목 '+(i+1),c.body||c.message||plain(c)])):'') );}\r
 return html;\r
}\r
function renderFollowUp(r){let html='';\r
 if(r.decisionNotes.length)html+=section('결론과 판단 근거',r.decisionNotes.map((n,i)=>'<div class="decision-note"><span class="source-kind">'+e({source_fact:'확인 사실',ai_interpretation:'인공지능 해석',unverified:'미확인'}[n.basis]||'판단 근거 미분류')+'</span><button class="decision-trigger" data-trace-kind="decision" data-trace-index="'+i+'"><span>'+e(n.body||n.title)+'</span><b>이 결론의 근거 따라보기 →</b></button>'+refs(n.sourceIds)+'</div>').join(''));\r
 else if(r.conclusion)html+=section('결론','<div class="summary-callout"><p>'+e(r.conclusion)+'</p></div>');\r
 if(r.nextSteps.length)html+=section('다음 실행',figure('결과에서 제안한 후속 작업','<div class="step-list">'+r.nextSteps.map((s,i)=>'<article><h3>'+e(typeof s==='string'?'후속 작업 '+(i+1):s.title||'후속 작업 '+(i+1))+'</h3>'+(plain(s)!==s.title?'<p>'+e(plain(s))+'</p>':'')+'</article>').join('')+'</div>','실행 결과에 담긴 제안입니다. 수행 완료를 의미하지 않습니다.'));\r
 return html;\r
}\r
function renderExecution(r){const x=r.execution;if(!x||![x.durationSeconds,x.totalTokens,x.inputTokens,x.outputTokens].some(number))return '';return section('실행 기록',table(['기록 항목','값'],[['실행 상태',r.status.label],['경과 시간',number(x.durationSeconds)?fmt(x.durationSeconds)+'초':'미제공'],['입력 토큰',fmt(x.inputTokens)],['출력 토큰',fmt(x.outputTokens)],['총 관측 토큰',fmt(x.totalTokens)]])+'<p class="metric-note">수치가 없는 항목은 미제공으로 표시합니다. 관측 토큰은 실제 청구 비용이나 개선 효과를 뜻하지 않습니다.</p>');}\r
function renderEvidence(){\r
 const query=$('#evidence-search').value.trim().toLowerCase(),all=report.evidence;\r
 const selected=all.filter(s=>(selectedFilter==='all'||(s.type||'자료')===selectedFilter)&&[s.id,s.title,s.body,s.url].join(' ').toLowerCase().includes(query));\r
 $('#evidence-count').textContent=selected.length+' / '+all.length+'개';\r
 $('#evidence-list').innerHTML=all.length?all.map((s,si)=>'<article id="evidence-'+(si+1)+'" data-evidence-index="'+si+'" class="tool-item source-card"'+(!selected.includes(s)?' hidden':'')+'><span class="source-kind">'+e(sourceLabel(s.id))+' · '+e(label(s.type)||'자료')+(s.synthetic===true?' · 합성 자료':'')+'</span><h3>'+e(s.title||s.id)+'</h3>'+(s.body?'<p class="source-body">'+e(s.body)+'</p>':'')+(s.location?'<p>'+e(s.location)+'</p>':'')+(safeUrl(s.url)?'<a class="source-url" href="'+e(safeUrl(s.url))+'" target="_blank" rel="noopener noreferrer">원문 열기 ↗</a>':'<p class="paper-note">연결된 원문 URL 없음</p>')+sourceMetadata(s)+'</article>').join(''):'<p class="source-empty">이 결과 파일에 전달된 출처가 없습니다.</p>';\r
 if(all.length&&!selected.length)$('#evidence-list').insertAdjacentHTML('beforeend','<p class="source-empty">검색 조건에 맞는 근거가 없습니다.</p>');\r
 if(traceState)highlightTrace(getTraceBundle().focus);\r
}\r
function render(raw,options={}){\r
 const next=window.HarnessReportAdapter.normalize(raw,options); // 검증 완료 후에만 이전 화면 교체\r
 payload=raw;report=next;figureNo=0;sectionNo=0;sourceIds=new Map();report.evidence.forEach((s,i)=>{if(!sourceIds.has(s.id))sourceIds.set(s.id,'evidence-'+(i+1));});selectedFilter='all';traceState=null;\r
 $('#report-title').textContent=report.title||[report.product.model||report.product.category||'키친 상품기획','분석 결과 보고서'].join('\\n');\r
 document.title=($('#report-title').textContent.replace(/\\n/g,' '))+' · LG AX';\r
 $('#report-byline').textContent=[report.meta.author||'키친에서치킨먹기',report.meta.generatedAt].filter(Boolean).join(' · ');\r
 $('#report-context-label').innerHTML=report.demo?'<span class="demo-badge">디자인 확인용 예시</span> · 실제 팀 하네스 실행 결과가 아닙니다.':e(fileLabel||report.meta.sourceFile||'연결된 하네스 결과')+' · <span class="report-status '+e(report.status.code)+'">'+e(report.status.label)+'</span>';\r
 $('#show-sample').hidden=report.demo||$('#embedded-report').textContent.trim()!=='null';\r
 const summary=report.summary?.length?report.summary:(report.conclusion?[report.conclusion]:[report.request||'하네스에서 전달한 결과를 본문과 근거 목록으로 정리했습니다.']);\r
 $('#report-summary').innerHTML=summary.map(p=>'<p>'+e(plain(p))+'</p>').join('');\r
 $('#report-keywords').textContent='보고 상태  '+report.status.label+(report.product.model?'  ·  대상 모델  '+report.product.model:'');\r
 const hasBusiness=report.request||report.discomforts.length||report.concepts.length||report.conclusion||report.review.summary||report.review.checks.length;\r
 let body=hasBusiness?renderBusiness(report):(report.evidence.length?renderKeywords(report):'');\r
 if(report.sections.length)body+=renderPlanSections(report.sections);\r
 body+=renderFollowUp(report);\r
 body+=renderExecution(report);\r
 if(report.unfulfilledRequests.length)body+=section('반영하지 못한 요청',table(['요청','반영하지 못한 이유'],report.unfulfilledRequests.map(x=>[x.request||plain(x),x.reason||'미제공'])));\r
 if(report.warnings.length)body+='<aside class="warnings-list"><strong>결과를 읽을 때 확인할 사항</strong><ul>'+report.warnings.map(w=>'<li>'+e(w)+'</li>').join('')+'</ul></aside>';\r
 $('#result-body').innerHTML=body||'<p class="empty-result">현재 상태는 '+e(report.status.label)+'이며, 표시할 최종 분석 내용이 제공되지 않았습니다.</p>';\r
 $('#source-description').textContent='본문·표·그래프에 연결된 '+report.evidence.length+'개 자료입니다. 항목을 검색하고 원문을 확인할 수 있습니다.';\r
 const kinds=[...new Set(report.evidence.map(s=>s.type||'자료'))];\r
 $('#evidence-filters').innerHTML=['all',...kinds].map(k=>'<button data-filter="'+e(k)+'" aria-pressed="'+(k==='all')+'">'+e(k==='all'?'전체':label(k))+'</button>').join('');\r
 $('#evidence-search').value='';renderEvidence();renderTraceLaunchers();\r
 $('#run-selector').hidden=report.turns.length<2;$('#turn-select').innerHTML=report.turns.map(t=>'<option value="'+e(t.id)+'"'+(t.id===report.selectedTurnId?' selected':'')+'>'+e(t.label||t.id)+'</option>').join('');$('#run-state').textContent=report.status.label;\r
 const heads=[{id:'paper',title:'표지 · 결과 요약'},...(!$('#evidence-trace').hidden?[{id:'evidence-trace',title:'결론 → 근거 따라보기'}]:[]),...$$('#result-body .paper-section').map(s=>({id:s.id,title:s.querySelector('h2').textContent})),{id:'sources',title:'원자료와 출처'}];\r
 $('#contents-list').innerHTML=heads.map((h,i)=>'<a href="#'+h.id+'"><b>'+String(i).padStart(2,'0')+'</b>'+e(h.title)+'</a>').join('');\r
 $('#quick-contents-list').innerHTML=heads.slice(1).map(h=>'<a href="#'+h.id+'">'+e(h.title)+'</a>').join('');\r
 $('#report-footer').textContent=report.demo?'디자인 확인을 위한 합성 예시입니다. 실제 하네스 파일을 불러오면 본문·표·그래프·근거가 해당 결과로 바뀝니다.':'이 보고서는 연결한 결과 파일을 표시한 문서입니다. 보고서 표시와 인쇄 과정에서 새로운 분석을 실행하지 않습니다.';\r
}\r
const traceBasis=b=>({source_fact:'확인 사실',ai_interpretation:'인공지능 해석',unverified:'미확인'}[b]||'기록된 판단');\r
function renderTraceLaunchers(){\r
 const entries=report.decisionNotes.length?report.decisionNotes.map((item,index)=>({item,index,kind:'decision'})):report.concepts.map((item,index)=>({item,index,kind:'concept'}));\r
 $('#evidence-trace').hidden=!entries.length;$('#trace-workspace').hidden=true;$('#trace-workspace').innerHTML='';document.body.classList.remove('trace-active');\r
 $('#trace-launchers').innerHTML=entries.map(({item,index,kind})=>'<button class="trace-launcher" id="trace-start-'+kind+'-'+index+'" data-trace-kind="'+kind+'" data-trace-index="'+index+'" aria-controls="trace-workspace" aria-expanded="false"><span class="trace-launcher-label">'+(kind==='decision'?'결론 '+(index+1)+' · '+e(traceBasis(item.basis)):'개선안 '+(index+1))+'</span><strong>'+e(item.body||item.title)+'</strong><span class="trace-launcher-footer"><span>명시된 근거 '+new Set(item.sourceIds).size+'건</span><b>근거 따라보기 →</b></span></button>').join('');\r
}\r
function getTraceBundle(){\r
 const origin=window.HarnessReportAdapter.trace(report,{kind:traceState.kind,index:traceState.index,turnId:report.selectedTurnId||undefined});\r
 const candidates=traceState.kind==='decision'?origin.related.concepts:[origin.seed].filter(Boolean);\r
 const focus=traceState.conceptIndex!=null?window.HarnessReportAdapter.trace(report,{kind:'concept',index:traceState.conceptIndex,turnId:report.selectedTurnId||undefined}):origin;\r
 return {origin,candidates,focus};\r
}\r
function traceSourceButtons(ids){return '<div class="trace-source-buttons">'+list(ids).map(id=>sourceIds.has(id)?'<button data-trace-source="'+e(id)+'">'+e(sourceLabel(id))+' ↗</button>':'<span>원자료 미제공</span>').join('')+'</div>';}\r
function traceItemHTML(item){return '<article class="trace-claim"><h4>'+e(item.title||item.body||'기록된 항목')+'</h4>'+(item.body&&item.title!==item.body?'<p>'+e(item.body)+'</p>':'')+(item.requirements?.length?'<ul>'+item.requirements.map(t=>'<li>'+e(t)+'</li>').join('')+'</ul>':'')+traceSourceButtons(item.matchedSourceIds||item.sourceIds)+'</article>';}\r
const tracePlanFields=[['metric','확인 지표'],['baseline','비교 기준'],['method','확인 방법'],['success_criterion','성공 조건'],['business_value','확인할 가치']];\r
const presentPlanFields=plan=>tracePlanFields.filter(([k])=>plan?.[k]!=null&&plain(plan[k]).trim());\r
function tracePlanHTML(seed){\r
 const plan=seed?.validationPlan,assumptions=list(seed?.assumptions);\r
 let html=assumptions.length?'<h4>확인할 전제</h4><ul>'+assumptions.map(t=>'<li>'+e(t)+'</li>').join('')+'</ul>':'';\r
 if(presentPlanFields(plan).length){html+='<dl class="trace-plan">'+presentPlanFields(plan).map(([k,t])=>'<div><dt>'+t+'</dt><dd>'+e(plain(plan[k]))+'</dd></div>').join('')+'</dl><p class="trace-note">기록된 검증 계획입니다. 검증 수행이나 효과 확정을 뜻하지 않습니다.</p>';}else html+='<p class="trace-empty">이 항목에 연결된 검증 계획이 없습니다.</p>';\r
 if(typeof seed?.requiresHardware==='boolean')html+='<p class="trace-note">추가 하드웨어: '+(seed.requiresHardware?'필요로 기록됨':'필요하지 않은 후보로 기록됨')+'</p>';\r
 return html||'<p class="trace-empty">이 항목에 연결된 검증 계획이 없습니다.</p>';\r
}\r
function traceSteps(focus){return [\r
 {title:'고객 불편',subtitle:'같은 근거를 참조하는 고객 불편',items:focus.related.discomforts},\r
 {title:'기존 기능',subtitle:'같은 근거를 참조하는 기존 기능',items:focus.related.existingFeatures},\r
 {title:'남은 문제',subtitle:'같은 근거를 참조하는 남은 문제',items:focus.related.remainingDiscomforts},\r
 {title:'개선안',subtitle:'선택한 개선안과 요구사항',items:focus.kind==='concept'&&focus.seed?[focus.seed]:focus.related.concepts},\r
 {title:'검증 계획',subtitle:'확인할 가정과 검증 방법',plan:true,seed:focus.kind==='concept'?focus.seed:null}\r
 ];}\r
function stageHTML(step){return step.plan?tracePlanHTML(step.seed):step.items.length?step.items.map(traceItemHTML).join(''):'<p class="trace-empty">같은 근거를 참조하는 '+e(step.title)+' 항목이 없습니다. 제공된 연결만 표시합니다.</p>';}\r
function renderTraceSources(focus,origin=focus){\r
 const seen=new Set(),rows=[...focus.sources,...origin.sources].filter(s=>{if(seen.has(s.evidenceIndex))return false;seen.add(s.evidenceIndex);return true;});\r
 return '<aside class="trace-evidence" aria-label="선택한 항목의 원자료"><header><h3>원자료 확인</h3><span>'+new Set(rows.map(s=>s.id)).size+'건 · '+rows.length+'개 인용</span></header><p class="trace-note">결론과 선택한 개선안이 직접 참조한 자료입니다. 근거 번호를 누르면 해당 인용이 강조됩니다.</p><div class="trace-evidence-scroll">'+rows.map((s,i)=>'<article class="trace-evidence-card" data-trace-evidence-id="'+e(s.id)+'"><span>'+e(sourceLabel(s.id))+' · '+e(label(s.type)||'자료')+(s.synthetic?' · 합성 예시':'')+'</span><small>'+[origin.kind==='decision'&&origin.sourceIds.includes(s.id)?'결론에 명시':'',focus.kind==='concept'&&focus.sourceIds.includes(s.id)?'선택한 개선안에 명시':''].filter(Boolean).join(' · ')+'</small><h4>'+e(s.title||sourceLabel(s.id))+'</h4>'+(s.body?'<blockquote>'+e(s.body)+'</blockquote>':'<p class="trace-empty">원문 인용이 제공되지 않았습니다.</p>')+(s.location?'<p class="trace-location">'+e(s.location)+'</p>':'')+(safeUrl(s.url)?'<a href="'+e(safeUrl(s.url))+'" target="_blank" rel="noopener noreferrer">원문 열기 ↗</a>':'')+'</article>').join('')+'</div>'+([...new Set([...focus.missingSourceIds,...origin.missingSourceIds])].length?'<p class="trace-empty">참조된 출처 중 원자료가 제공되지 않은 항목이 있습니다.</p>':'')+(!rows.length?'<p class="trace-empty">이 항목에 명시된 원자료가 없습니다.</p>':'')+'</aside>';\r
}\r
function highlightTrace(focus){\r
 const matched=new Set();['discomforts','existingFeatures','remainingDiscomforts','concepts'].forEach(k=>focus.related[k].forEach(item=>matched.add(k+':'+item.index)));\r
 if(focus.kind==='concept'&&focus.seed)matched.add('concepts:'+focus.seed.index);\r
 $$('.result-card[data-claim-kind]').forEach(card=>card.classList.toggle('trace-match',matched.has(card.dataset.claimKind+':'+card.dataset.claimIndex)));\r
 const ids=new Set(focus.sourceIds);$$('.source-card').forEach(card=>card.classList.toggle('trace-match',ids.has(report.evidence[Number(card.dataset.evidenceIndex)]?.id)));\r
 document.body.classList.add('trace-active');\r
}\r
function renderTraceWorkspace(focusHeading=false){\r
