schema: spec-driven

context: |
  Language: Korean
  All artifacts must be written in Korean.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  This is a new Codex and Claude Code development harness repository.
  Do not reuse existing LG code, prompts, skills, MCP, data, evaluations, or UI.
  The competition task, product language, model, runtime, and architecture remain undecided.
  OpenSpec validation checks artifacts; actual code and task quality require separate checks.
  Agent/message visualization is a possible future competition-runtime feature, outside this development harness.
  Use npm run spec -- <arguments> for the pinned project-local OpenSpec CLI.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
